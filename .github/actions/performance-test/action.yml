name: k6 performance test
description: Run k6 against the release binary with the bundled fixtures
runs:
  using: composite
  steps:
    - name: Clear cached k6 results
      shell: bash
      run: rm -f target/k6-summary.json target/k6.log target/k6-server.log
    - name: Set up k6
      uses: grafana/setup-k6-action@v1.2.2
      with:
        k6-version: '2.3.0'
    - name: Run k6 performance test
      shell: bash
      run: |
        mkdir -p target
        ./target/release/pdfgenrs > target/k6-server.log 2>&1 &
        server_pid=$!
        trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
        ready=false
        for attempt in {1..60}; do
          if ! kill -0 "$server_pid" 2>/dev/null; then
            cat target/k6-server.log
            echo 'Server exited before becoming ready.' >&2
            exit 1
          fi
          if curl --fail --silent --show-error --max-time 1 http://localhost:8080/internal/is_ready; then
            ready=true
            break
          fi
          sleep 1
        done
        if [ "$ready" != true ]; then
          cat target/k6-server.log
          echo 'Server did not become ready within 60 attempts.' >&2
          exit 1
        fi
        k6 run --summary-export=target/k6-summary.json performance-test/script.js 2>&1 | tee target/k6.log
    - name: Add k6 results to job summary
      if: always()
      shell: bash
      run: |
        {
          echo '## k6 performance test'
          echo ''
          echo '```text'
          if [ -f target/k6.log ]; then
            cat target/k6.log
          else
            echo 'k6 did not run. See the failed setup or server startup step.'
          fi
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Upload k6 results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: k6-results
        path: |
          target/k6-summary.json