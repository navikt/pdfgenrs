name: Test Dockerfile

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-dockerfile:
    name: Build and test Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Build Docker image
        run: docker build --tag pdfgenrs:test .
      - name: Start container
        run: |
          docker run \
            --name pdfgenrs \
            --detach \
            -p 8080:8080 \
            -v "${{ github.workspace }}/templates:/app/templates:ro" \
            -v "${{ github.workspace }}/data:/app/data:ro" \
            -v "${{ github.workspace }}/resources:/app/resources:ro" \
            -e DEV_MODE=true \
            pdfgenrs:test
      - name: Wait for service to be ready
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://localhost:8080/internal/is_ready; then
              exit 0
            fi
            sleep 2
          done
          docker logs pdfgenrs
          exit 1
      - name: Generate PDFs from all test data
        run: |
          set -euo pipefail
          while IFS= read -r -d '' data_file; do
            relative="${data_file#data/}"
            group="$(dirname "$relative")"
            name="$(basename "$relative" .json)"
            output="$(mktemp --suffix=.pdf)"

            curl --fail --silent --show-error \
              --header "Content-Type: application/json" \
              --data @"$data_file" \
              --output "$output" \
              "http://localhost:8080/api/v1/genpdf/$group/$name"

            test "$(file --mime-type --brief "$output")" = "application/pdf"
          done < <(find data -type f -name '*.json' -print0 | sort -z)
      - name: Generate HTML from test data
        run: |
           set -euo pipefail
           output="$(mktemp --suffix=.html)"
           content_type="$(curl --fail --silent --show-error \
             --header "Content-Type: application/json" \
             --data @data/bench/html-bench.json \
             --output "$output" \
             --write-out '%{content_type}' \
             http://localhost:8080/api/v1/genhtml/bench/html-bench)"

           test "$content_type" = "text/html; charset=utf-8"
           grep --quiet "HTML Benchmark Document" "$output"
      - name: Verify runtime metrics
        run: |
          set -euo pipefail
          metrics="$(mktemp)"
          curl --fail --silent --show-error --output "$metrics" \
            http://localhost:8080/internal/metrics

          for name in \
            process_cpu_seconds_total \
            process_resident_memory_bytes \
            process_virtual_memory_bytes \
            process_threads \
            process_open_fds \
            process_max_fds \
            process_start_time_seconds \
            tokio_runtime_workers \
            tokio_runtime_alive_tasks \
            tokio_runtime_global_queue_depth \
            pdfgenrs_compile_permits_available \
            pdfgenrs_compile_permits_total \
            pdfgenrs_compile_in_flight; do
            grep --quiet "^# TYPE $name " "$metrics" \
              || { echo "missing TYPE line for $name"; cat "$metrics"; exit 1; }
          done

          # Values that must be greater than zero in a running container. A name that is
          # present but always zero means the collector never read the process.
          for name in \
            process_resident_memory_bytes \
            process_threads \
            process_open_fds \
            process_start_time_seconds \
            tokio_runtime_workers; do
            value="$(awk -v n="$name" '$1 == n { print $2 }' "$metrics")"
            awk -v v="$value" -v n="$name" \
              'BEGIN { if (v + 0 <= 0) { print n " is not greater than zero: " v; exit 1 } }'
          done

          test "$(awk '$1 == "pdfgenrs_compile_permits_total" { print $2 }' "$metrics")" = "4"
      - name: Show container logs
        if: always()
        run: |
          docker logs pdfgenrs 2>&1 || true
          docker rm --force pdfgenrs 2>/dev/null || true
