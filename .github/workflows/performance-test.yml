name: k6 performance test

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '**.MD'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.MD'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  performance-test:
    name: Run k6 performance test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.1
      - name: Cache Rust dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-1.98.1-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.98.1-cargo-
      - name: Build
        run: cargo build --locked --release
      - name: Run k6 performance test
        uses: ./.github/actions/performance-test
