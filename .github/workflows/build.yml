name: Build and test main
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '**.MD'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  checks: write
  
jobs:
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Audit dependencies
        id: audit
        continue-on-error: true
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add audit vulnerabilities to job summary
        if: ${{ always() }}
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          {
            echo '## Dependency audit'
            if [ "$AUDIT_OUTCOME" = 'success' ]; then
              echo 'No vulnerabilities or warnings found.'
            else
              cargo audit --json > audit.json || true
              jq -r '
                .vulnerabilities.list[] |
                "### [\(.advisory.id)](https://rustsec.org/advisories/\(.advisory.id).html)\n\n\(.advisory.title)\n\n- Package: `\(.package.name)` `\(.package.version)`\n- Patched versions: `\(.versions.patched | join(", "))`\n\n\(.advisory.description)\n"
              ' audit.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$AUDIT_OUTCOME" = 'success' ]
  build:
    name: Test and build application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-1.98.1-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-1.98.1-cargo-
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Run Clippy
        run: cargo clippy --locked --release --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked -- --nocapture
      - name: Run Benchmark performance test
        run: cargo bench --locked --bench performance
      - name: Build
        run: cargo build --locked --release
  
